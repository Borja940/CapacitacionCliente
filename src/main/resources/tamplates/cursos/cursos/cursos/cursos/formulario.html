<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Cursos</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="container mt-4">
    <div class="row">
        <div class="col-6">
             <div class="Card">
                 <div class="card-body">
                     <h5>Nuevo Curso</h5>
                     <form th:action="@{/cursos/guardar}" th:object="${curso}" method="post">
                         <div class="mb-2">
                             <label class="form-label">Código</label>
                             <input type="text" th:field="*{codigo}" class="form-control">
                             <p th:if="${fields.hasErrors('codigo')}" th:errors="*{codigo}" class="text-danger small" ></p>
                         </div>
                         <div class="mb-2">
                             <label class="form-label">Nombre del Curso</label>
                             <input type="text" th:field="*{nombre}" class="form-control">
                             <p th:if="${fields.hasErrors('nombre')}" th:errors="*{nombre}" class="text-danger small" ></p>
                         </div>
                         <div class="mb-2">
                             <label class="form-label">Modalidad</label>
                             <select th:field="*{modalidad}" class="form-select">
                                 <option value=""> Seleccione </option>
                                 <option value="presencial">Presencial</option>
                                 <option value="Virtual">Virtual</option>
                             </select>
                             </div>
                             <div class="mb-2">
                                 <label class="form-label">Cupo</label>
                                 <input type="number" th:field="*{cupo}" class="form-control">
                             </div>
                             <div class="mb-2">
                                 <label class="form-label">Fecha Inicio</label>
                                 <input type="date" th:field="*{fechaInicio}" class="form-control">
                             </div>
                             <div class="mb-2">
                                 <label class="form-label">Fecha Inicio</label>
                                 <textarea th:field="*{descripcion}" class="form-control"></textarea>
                             </div>
                             <br>
                             <button type="submit" class="btn btn-primary">Guardar</button>
                             <a th:href="@{/cursos" class="btn-secondary">Regresar</a>
                     </form>
                 </div>
             </div>
        </div>
    </div>
</body>
</html>
