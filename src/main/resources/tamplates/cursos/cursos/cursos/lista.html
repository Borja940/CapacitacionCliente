<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Cursos</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body> Class="container mt-4">
     <h2>Catálogo de cursos</h2>
     <a th:href="@{/cursos/nuevo}" class= "btn btn-primaty mb-3">Nuevo Curso</a>

     <div class="card">
         <div class="card body">
             <table class="table table-borderer">
                 <thead>
                 <tr>
                     <th>Código</th>
                     <th>Nombre</th>
                     <th>Modalidad</th>
                     <th>Cupo</th>
                     <th>Fecha Inicio</th>
                     <th>Acción</th>
                 </tr>
                 </thead>
                 <tbody>
                     <tr th:each="c : ${cursos}">
                         <td th:text="${c.codigo}"></td>
                         <td th:text="${c.nombre}"></td>
                         <td th:text="${c.modalidad}"></td>
                         <td th:text="${c.cupo}"></td>
                         <td th:text="${c.fechaInicio}"></td>
                 <td>
                     <a th:href="@{/cursos/eliminar/{id}(id=${c.id})}" class="btn btn-danger btn-sm"
                        onclick="return confirm('Eliminar curso')">Eliminar</a>
                 </td>
                     </tr>
                 </tbody>
             </table>
         </div>
     </div>
</body>
</html>
